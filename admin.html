<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการสิทธิ์ครู</title><link rel="stylesheet" href="assets/app.css"></head><body class="cloud-protected">
<div class="admin-page"><div class="classroom-page-head"><div><h1 style="margin:0">👥 จัดการครูและสิทธิ์ห้องเรียน</h1><div class="sub">สำหรับผู้ดูแลระบบ</div></div><div class="actions"><a class="btn gray" href="classrooms.html">← ห้องเรียนของฉัน</a><button class="btn danger" onclick="cloudLogout()">ออกจากระบบ</button></div></div>
<section class="panel admin-section"><div class="admin-hint">สร้างบัญชีครูใหม่ที่ <b>Supabase → Authentication → Users → Add user</b> แล้วกลับมาหน้านี้</div><h2>บัญชีผู้ใช้</h2>
<div class="table-wrap"><table class="data"><thead><tr><th>ชื่อ</th><th>อีเมล</th><th>ประเภท</th><th>จัดการ</th></tr></thead><tbody id="teacherTableBody"></tbody></table></div></section>
<section class="panel admin-section"><h2 style="margin-top:0">กำหนดครูให้ห้องเรียน</h2><div class="cloud-form-grid"><div class="field"><label>ครู</label><select id="assignTeacher"></select></div>
<div class="field"><label>ห้องเรียน</label><select id="assignClassroom"></select></div><div class="field"><label>สิทธิ์</label><select id="assignPermission"><option value="owner">owner — จัดการห้อง</option><option value="editor" selected>editor — กรอก/แก้ไข</option><option value="viewer">viewer — ดู/พิมพ์เท่านั้น</option></select></div></div>
<div class="actions" style="margin-top:10px"><button class="btn primary" onclick="cloudAssignTeacher()">บันทึกสิทธิ์</button></div></section>
<section class="panel admin-section"><h2 style="margin-top:0">สิทธิ์ที่กำหนดแล้ว</h2><div class="table-wrap"><table class="data"><thead><tr><th>ครู</th><th>ห้องเรียน</th><th>สิทธิ์</th><th>จัดการ</th></tr></thead><tbody id="assignmentTableBody"></tbody></table></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script><script src="assets/supabase-config.js"></script><script src="assets/cloud.js"></script><script>startAdminPage()</script></body></html>
