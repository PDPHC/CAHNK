<!doctype html><meta charset="utf-8"><button data-final="30">ทดสอบ 70 : 30</button><button data-final="20">ทดสอบ 80 : 20</button><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const job=crypto.randomUUID(),child=window.open('../print/pp5.html?job='+job),final=Number(b.dataset.final),patches={'IN!E3':100-final,'IN!F3':0,'IN!H3':0,'IN!I3':0,'IN!J3':final};const listener=e=>{if(e.origin!==location.origin||e.source!==child||e.data?.job!==job)return;child.postMessage({type:'pp5-print-data',job,patches,report:'G',title:'ทดสอบสัดส่วน'},location.origin);window.removeEventListener('message',listener)};window.addEventListener('message',listener)});</script>
