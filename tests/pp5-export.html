<!doctype html><html lang="th"><meta charset="utf-8"><title>PP5 template preservation test</title>
<h1>ทดสอบการรักษาแม่แบบ ปพ.5</h1><p>เลือกไฟล์ต้นฉบับ ข้อมูลอยู่ในเบราว์เซอร์และไม่ถูกส่งออกเครือข่าย</p><input id="source" type="file" accept=".xlsx"><pre id="result"></pre>
<script src="../assets/vendor/jszip-3.10.1.min.js"></script><script src="../assets/pp5-workbook.js"></script><script>
document.getElementById('source').onchange=async e=>{const out=document.getElementById('result');try{
const bytes=new Uint8Array(await e.target.files[0].arrayBuffer()),b=await PP5Workbook.Book.open(bytes),patch={'IN!Q8':'ทดสอบ & <ข้อความ>','IN!E4':12,'IN!F4':0,'IN!C4':'00001','D!C8':'ตัวชี้วัดทดสอบ','CH!G7':'/','W1!F5':46200};
let count=0;const ok=(v,s)=>{if(!v)throw Error(s);count++};
ok((await b.export({})).every((v,i)=>v===bytes[i]),'No-edit byte identity');
const result=await b.export(patch),next=await PP5Workbook.Book.open(result);
for(const [k,v] of Object.entries(patch)){const [s,r]=k.split('!');ok(next.value(s,r)===v,'Round trip '+k)}
for(const s of ['IN','CH','D','W1'])for(const [ref,c] of Object.entries(b.cells[s]))if(c.formula!==null)ok(c.formula===next.cells[s][ref]?.formula,'Formula '+s+'!'+ref);
const a=await JSZip.loadAsync(bytes),z=await JSZip.loadAsync(result),changed=new Set(['xl/workbook.xml',...['IN','D','CH','W1'].map(s=>b.sheets[s].path)]);
for(const p of Object.keys(a.files))if(!a.files[p].dir&&!changed.has(p))ok(await a.file(p).async('base64')===await z.file(p).async('base64'),'Preserved part '+p);
let rejected=false;try{await b.export({'IN!L4':20})}catch{rejected=true}ok(rejected,'Formula overwrite rejection');
out.textContent='PASS '+count+' checks: values, zero, identifiers, formulas, styles, drawings, print settings and unchanged OOXML parts.';
}catch(error){out.textContent='FAIL '+error.message}};
</script></html>
