<!doctype html><meta charset="utf-8"><pre id="result">กำลังทดสอบ</pre><script src="../assets/vendor/jszip-3.10.1.min.js"></script><script src="../assets/pp5-workbook.js?v=11"></script><script>
(async()=>{const template=await(await fetch('../assets/pp5-template.json')).json();const book=await PP5Workbook.Book.open(Uint8Array.from(atob(template.base64),c=>c.charCodeAt(0)));const patches={'IN!C4':'001','IN!D4':'นักเรียนทดสอบ †','IN!C5':'002','IN!D5':'นักเรียนทดสอบ ‡','IN!C6':'003','IN!D6':'นักเรียนทดสอบ ★','F!H9':3};const bytes=await book.export(patches),next=await PP5Workbook.Book.open(bytes),zip=await JSZip.loadAsync(bytes),parse=t=>new DOMParser().parseFromString(t,'application/xml');let checks=0;const assert=(v,m)=>{if(!v)throw Error(m);checks++};for(const [sheet,start,end] of [['B',11,55],['C',9,52],['E',9,52],['F',7,66],['CH',7,66]]){const doc=parse(next.sheets[sheet].raw);assert(!doc.querySelector('parsererror'),sheet+' invalid XML');assert(doc.querySelector('row[r="'+(start+2)+'"]').getAttribute('hidden')!=='1',sheet+' last pupil hidden');assert(doc.querySelector('row[r="'+(start+3)+'"]').getAttribute('hidden')==='1',sheet+' empty row visible');assert(doc.querySelector('row[r="'+end+'"]').getAttribute('hidden')==='1',sheet+' final empty row visible');assert(doc.querySelector('oddFooter').textContent.includes('† ย้ายออก'),sheet+' missing legend')};assert(next.value('F','H9')===3,'manual score lost');assert(next.value('IN','D6').endsWith('★'),'symbol lost');const styles=parse(await zip.file('xl/styles.xml').async('string'));assert(!styles.querySelector('parsererror'),'invalid styles');const id=parse(next.sheets.C.raw).querySelector('c[r="D9"]').getAttribute('s');assert(styles.querySelector('cellXfs').children[+id].querySelector('alignment').getAttribute('shrinkToFit')==='1','names not fitted');document.getElementById('result').textContent='PASS: '+checks+' checks — trailing rows, status legends, names, styles, scores preserved';})().catch(e=>document.getElementById('result').textContent='FAIL '+e.stack);
</script>
