<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตั้งรหัสผ่านใหม่</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-logo">🔐</div>
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <div class="sub">ระบบธุรการชั้นเรียน</div>
    <div id="resetMessage" class="login-message">กำลังตรวจสอบลิงก์...</div>
    <div id="resetPasswordForm" style="display:none">
      <div class="field">
        <label>รหัสผ่านใหม่</label>
        <input id="newPassword" type="password" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัวอักษร">
      </div>
      <div class="field">
        <label>ยืนยันรหัสผ่านใหม่</label>
        <input id="newPasswordConfirm" type="password" autocomplete="new-password">
      </div>
      <button class="btn primary" id="resetSubmitBtn" type="button" onclick="cloudUpdatePassword()">บันทึกรหัสผ่านใหม่</button>
    </div>
    <a class="login-back-link" href="login.html">← กลับหน้าเข้าสู่ระบบ</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/cloud.js"></script>
<script>startResetPasswordPage()</script>
</body>
</html>
